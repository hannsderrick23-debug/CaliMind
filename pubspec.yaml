name: calimind
description: "Voice-first daily task planner & AI scheduling assistant."
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Routing & Navigation
  go_router: ^14.2.0

  # Backend & Database
  supabase_flutter: ^2.8.0

  # Voice & Audio Hardware
  speech_to_text: ^7.0.0          # Native iOS SFSpeechRecognizer & Android SpeechRecognizer
  record: ^7.1.1                  # Fallback high-fidelity audio recorder for Whisper API
  flutter_tts: ^4.2.0             # Native Text-To-Speech audio feedback
  audioplayers: ^6.1.0            # Sound effects & feedback chimes

  # Hardware & Native Features
  local_auth: ^2.3.0              # Biometric unlock (FaceID / Fingerprint)
  flutter_secure_storage: ^9.2.2  # Encrypted iOS Keychain / Android EncryptedSharedPrefs
  share_plus: ^10.1.0             # Native OS share dialog for announcements
  flutter_local_notifications: ^18.0.0 # Reminders & task schedule alerts
  url_launcher: ^6.3.0
  path_provider: ^2.1.4

  # HTTP & Cloud APIs
  http: ^1.2.2

  # UI, Icons, Typography & Motion
  google_fonts: ^6.2.1            # Space Grotesk, Inter, JetBrains Mono
  lucide_icons_flutter: ^3.1.21   # Modern Lucide icons
  flutter_animate: ^4.5.0         # Micro-interactions & mic-pulse animations
  intl: ^0.20.2                   # Date formatting and localization
  font_awesome_flutter: ^11.0.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  home_widget: ^0.10.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/welcome_photo.jpg
    - assets/branding/register_photo.jpg
    - assets/branding/planning_photo.jpg
    - assets/branding/calimind_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/calimind_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#641A91"
  adaptive_icon_foreground: assets/branding/calimind_mark.png
